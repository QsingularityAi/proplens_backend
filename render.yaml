services:
  - type: web
    name: proplens-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn proplens_ai.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        sync: false
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash-exp"
      - key: GEMINI_EMBEDDING_MODEL
        value: "models/embedding-001"
      - key: DJANGO_SETTINGS_MODULE
        value: "proplens_ai.settings"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: CHROMA_TELEMETRY_DISABLED
        value: "True"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

